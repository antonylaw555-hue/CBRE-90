const { useState, useEffect, useRef, useCallback } = React;

const AUTH_KEY = "cbre_auth_v1";
const PASS_HASH = "55ddc0c187444ff24adc0b05d0bfe5e30fdb837a9d1443a309df5c897478c00a"; // SHA-256 of CBRE2025

async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function LockScreen({ onUnlock }) {
  const ref = useRef(null);
  const [err, setErr] = useState(false);
  const [checking, setChecking] = useState(false);

  const attempt = async () => {
    const val = ref.current?.value || "";
    if (!val.trim()) return;
    setChecking(true);
    const hash = await sha256(val.trim());
    if (hash === PASS_HASH) {
      localStorage.setItem(AUTH_KEY, hash);
      onUnlock();
    } else {
      setErr(true);
      setChecking(false);
      if (ref.current) ref.current.value = "";
      setTimeout(() => setErr(false), 2000);
    }
  };

  return (
    <div style={{minHeight:"100vh",background:"#0b1f14",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
      <div style={{width:"100%",maxWidth:"320px"}}>
        <div style={{textAlign:"center",marginBottom:"32px"}}>
          <div style={{display:"inline-block",background:"#3dbe7a",color:"#000",fontFamily:"monospace",fontWeight:"900",fontSize:"14px",padding:"6px 12px",borderRadius:"2px",marginBottom:"16px"}}>CBRE</div>
          <div style={{fontSize:"18px",color:"#f0f5f1",marginBottom:"4px"}}>90-Day Plan</div>
          <div style={{fontSize:"11px",color:"#6b9e7e",fontFamily:"monospace",letterSpacing:"2px"}}>GWS LOCAL · VICTORIA</div>
        </div>
        <div style={{background:"#112219",border:"1px solid #1e3d2a",borderRadius:"4px",padding:"24px"}}>
          <div style={{fontSize:"10px",fontFamily:"monospace",color:"#6b9e7e",letterSpacing:"3px",textTransform:"uppercase",marginBottom:"8px"}}>Access Code</div>
          <input
            ref={ref}
            type="password"
            placeholder="Enter password"
            onKeyDown={e => e.key === "Enter" && attempt()}
            style={{width:"100%",background:"#152b1e",border:`1px solid ${err?"#e07060":"#1e3d2a"}`,color:"#f0f5f1",padding:"13px",fontFamily:"Georgia,serif",fontSize:"16px",borderRadius:"3px",outline:"none",boxSizing:"border-box",marginBottom:"10px",transition:"border-color 0.2s"}}
          />
          {err && <div style={{color:"#e07060",fontSize:"12px",fontFamily:"monospace",marginBottom:"10px",textAlign:"center"}}>Incorrect password</div>}
          <button onClick={attempt} disabled={checking} style={{width:"100%",background:"#3dbe7a",color:"#000",border:"none",padding:"13px",fontFamily:"monospace",fontSize:"13px",fontWeight:"700",letterSpacing:"2px",borderRadius:"3px",cursor:"pointer",opacity:checking?0.6:1}}>
            {checking ? "CHECKING..." : "UNLOCK"}
          </button>
        </div>
        <div style={{textAlign:"center",marginTop:"16px",fontSize:"10px",color:"#1e3d2a",fontFamily:"monospace"}}>
          Protect the Base. Strengthen the Engine. Scale Profitably.
        </div>
      </div>
    </div>
  );
}

function load(key, fallback) {

}
function save(key, val) {

  // Returns nearest Friday (this Friday if today is Mon-Fri, next Friday if Sat/Sun)
  const getNearestFriday = () => {
    const d = new Date();
    const day = d.getDay();
    const daysToFriday = day === 0 ? 5 : day === 6 ? 6 : (5 - day);
    d.setDate(d.getDate() + daysToFriday);
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const yyyy = d.getFullYear();
    return yyyy + '-' + mm + '-' + dd;
  };
  const fmtDate = (iso) => {
    if (!iso) return '';
    const p = iso.split('-');
    return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
  };

function EmailPanel({C, btnG, objs, rpt, startDate, fmtDate, getNearestFriday}) {
  const [emailStatus, setEmailStatus] = React.useState('');
  const emailRef = React.useRef(null);

  const sendEmail = () => {
    const emailToVal = emailRef.current ? emailRef.current.value.trim() : '';
    if (!emailToVal) { setEmailStatus('error:Please enter a recipient email address.'); return; }
    const pNames = {1:'Days 1-30 · Earn the Right',2:'Days 31-60 · Surface Clarity',3:'Days 61-90 · Align Direction'};
    const allObjs = Object.entries(objs).flatMap(([pid,items])=>items.map(o=>({...o,phase:pNames[pid]})));
    const dayNum  = startDate ? Math.min(90,Math.max(1,Math.floor((new Date()-new Date(startDate))/86400000)+1)) : '—';

      const p = objs[pid]||[]; const d = p.filter(o=>o.status==='complete').length;

    }).join('');
    const objRows = allObjs.map((o,i) =>
      '<tr style="background:'+(i%2===0?'#f5faf7':'#ffffff')+';"><td style="padding:8px 12px;font-size:11px;color:#555;border-bottom:1px solid #e2e8e4;white-space:nowrap;">'+o.phase+'</td><td style="padding:8px 12px;font-size:12px;color:#1a1a1a;border-bottom:1px solid #e2e8e4;">'+o.text+'</td><td style="padding:8px 12px;border-bottom:1px solid #e2e8e4;text-align:center;white-space:nowrap;"><span style="display:inline-block;background:'+(sBg[o.status]||'#6b7280')+';color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:3px;">'+(sTxt[o.status]||o.status)+'</span></td></tr>'
    ).join('');
    const section = (title,content) => content ? '<tr><td style="padding:0 28px 20px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding-bottom:10px;border-bottom:2px solid #3dbe7a;"><span style="font-size:10px;font-weight:700;letter-spacing:2px;color:#006241;text-transform:uppercase;">'+title+'</span></td></tr><tr><td style="padding-top:10px;font-size:13px;color:#333;line-height:1.8;white-space:pre-wrap;">'+content+'</td></tr></table></td></tr>' : '';
    const subject = 'CBRE GWS Local VIC · BUD Weekly Update · Week Ending '+weekEnd+' (Day '+dayNum+' of 90)';
    const emailHTML = '<!DOCTYPE html><html><body style="margin:0;padding:20px;background:#f0f2f0;font-family:Arial,Helvetica,sans-serif;"><table width="680" cellpadding="0" cellspacing="0" border="0" style="margin:0 auto;background:#ffffff;border-radius:4px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.12);"><tr><td style="background:#006241;padding:0;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding:22px 28px;vertical-align:middle;"><table cellpadding="0" cellspacing="0" border="0"><tr><td style="padding-right:14px;vertical-align:middle;"><div style="background:#3dbe7a;display:inline-block;padding:6px 14px;border-radius:2px;"><span style="font-size:15px;font-weight:900;color:#0b1f14;letter-spacing:3px;">CBRE</span></div></td><td style="vertical-align:middle;border-left:1px solid rgba(255,255,255,0.3);padding-left:14px;"><div style="font-size:17px;font-weight:700;color:#ffffff;letter-spacing:1px;">GWS LOCAL · VICTORIA</div><div style="font-size:10px;color:rgba(255,255,255,0.7);letter-spacing:2px;margin-top:3px;">BUSINESS UNIT DIRECTOR · WEEKLY UPDATE</div></td></tr></table></td><td style="padding:22px 28px;text-align:right;vertical-align:middle;"><div style="color:rgba(255,255,255,0.7);font-size:10px;letter-spacing:1px;text-transform:uppercase;">Week Ending</div><div style="color:#3dbe7a;font-size:18px;font-weight:700;margin-top:2px;">'+weekEnd+'</div><div style="color:rgba(255,255,255,0.6);font-size:11px;margin-top:4px;background:rgba(0,0,0,0.2);display:inline-block;padding:2px 10px;border-radius:10px;">Day '+dayNum+' of 90</div></td></tr></table></td></tr><tr><td style="background:#0b1f14;padding:16px 20px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr>'+phases+'</tr></table></td></tr><tr><td style="height:24px;"></td></tr>'+section('Progress / Highlights',rpt.highlights)+section('Blockers / Risks',rpt.blockers)+section('Next Week Priorities',rpt.nextWeek)+'<tr><td style="padding:0 28px 24px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="padding-bottom:10px;border-bottom:2px solid #3dbe7a;"><span style="font-size:10px;font-weight:700;letter-spacing:2px;color:#006241;text-transform:uppercase;">Objective Status</span></td></tr><tr><td style="padding-top:10px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr style="background:#006241;"><th style="padding:8px 12px;text-align:left;font-size:10px;font-weight:700;color:#fff;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;">Phase</th><th style="padding:8px 12px;text-align:left;font-size:10px;font-weight:700;color:#fff;letter-spacing:1px;text-transform:uppercase;">Objective</th><th style="padding:8px 12px;text-align:center;font-size:10px;font-weight:700;color:#fff;letter-spacing:1px;text-transform:uppercase;white-space:nowrap;">Status</th></tr>'+objRows+'</table></td></tr></table></td></tr><tr><td style="background:#006241;padding:12px 28px;"><table width="100%" cellpadding="0" cellspacing="0" border="0"><tr><td style="font-size:11px;color:rgba(255,255,255,0.8);">CBRE GWS Local · Victoria</td><td style="font-size:11px;color:rgba(255,255,255,0.6);text-align:center;">Confidential · Internal Use Only</td><td style="font-size:11px;color:rgba(255,255,255,0.8);text-align:right;">Generated '+today+'</td></tr></table></td></tr></table></body></html>';
    // Copy branded HTML to clipboard
    navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([emailHTML], {type:'text/html'}), 'text/plain': new Blob([subject], {type:'text/plain'})})]).catch(function() {
      navigator.clipboard.writeText(emailHTML).catch(function() {});
    });
    // Open Gmail compose with just To + Subject (body blank for paste)
    const gmailUrl = 'https://mail.google.com/mail/?view=cm&to='+encodeURIComponent(emailToVal)+'&su='+encodeURIComponent(subject);
    window.open(gmailUrl,'_blank');
    setEmailStatus('pasted');
  };

  return (
    <div style={{marginTop:"16px",borderTop:"1px solid "+C.border,paddingTop:"16px"}}>
      <div style={{fontSize:"10px",fontWeight:700,letterSpacing:"2px",color:C.muted,marginBottom:"8px"}}>SEND WEEKLY EMAIL</div>

        style={{width:"100%",background:C.card,border:"1px solid "+C.border,color:C.text,padding:"10px 12px",fontSize:"13px",borderRadius:"4px",boxSizing:"border-box",marginBottom:"8px",fontFamily:"monospace"}}/>
      <button onClick={sendEmail} style={{...btnG,marginBottom:"6px"}}>📧 COPY & OPEN GMAIL</button>
      <div style={{minHeight:"22px",textAlign:"center",marginTop:"4px"}}>
        {(emailStatus==='sent'||emailStatus==='pasted') && <span style={{color:C.green,fontSize:"12px",fontWeight:700}}>✅ Gmail opened · Branded HTML copied — paste into body (Ctrl+V) then Send!</span>}
        {emailStatus.startsWith('error:') && <span style={{color:"#c0392b",fontSize:"12px"}}>⚠️ {emailStatus.replace('error:','')}</span>}
      </div>

function App() {
  const [tab, setTab]           = useState("plan");
  const [phase, setPhase]       = useState(1);
  const [objs, setObjs]         = useState(()=>load(SKEY,{}).objectives||DEFAULT_OBJ);
  const [intel, setIntel]       = useState(()=>load(SKEY,{}).intel||[]);
  const [startDate, setStartDate]=useState(()=>load(SKEY,{}).startDate||"");
  const [saved, setSaved]       = useState(false);
  const [expandedId, setExpandedId]=useState(null);
  const [editNoteId, setEditNoteId]=useState(null);
  const [rpt, setRpt]           = useState(()=>load(RKEY,{highlights:"",blockers:"",nextWeek:"",weekEnding:getNearestFriday()}));

  // weekEnding defaults to nearest Friday in initial state
  const printContentRef = useRef(null);

  const persist = useCallback((o,i,sd)=>{
    save(SKEY,{objectives:o,intel:i,startDate:sd});
    setSaved(true); setTimeout(()=>setSaved(false),1600);
  },[]);

  const exportData = ()=>{
    const data={objectives:objs,intel:intel,startDate:startDate,rpt:rpt,exported:new Date().toISOString()};
    const str=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    navigator.clipboard.writeText(str).then(()=>{
      alert('\u2705 Data copied to clipboard!\n\nOn your other device: open the app, go to Stats tab, tap Import, then paste.');
    }).catch(()=>{ window.prompt("Copy this code:",str); });
  };

  const importData = ()=>{
    const str=window.prompt("Paste the export code from your other device:");
    if(!str||!str.trim())return;
    try{
      const data=JSON.parse(decodeURIComponent(escape(atob(str.trim()))));
      if(data.objectives){setObjs(data.objectives);save(SKEY,{objectives:data.objectives,intel:data.intel||[],startDate:data.startDate||""});}
      if(data.intel) setIntel(data.intel);
      if(data.startDate) setStartDate(data.startDate);
      if(data.rpt){setRpt(data.rpt);save(RKEY,data.rpt);}
      alert('\u2705 Data imported! Your tracker is now synced.');
    }catch(e){alert('\u274C Invalid code. Copy the full export string.');}
  };

  const [aiDrafting, setAiDrafting] = React.useState(false);
  const [aiError, setAiError] = React.useState('');
  // email state moved to EmailPanel component

  const aiDraftReport = () => {
    setAiDrafting(true);
    setAiError('');
    try {
      const phaseNames = {1:'Days 1-30 (Earn the Right)',2:'Days 31-60 (Surface Clarity)',3:'Days 61-90 (Align Direction)'};
      const allObjs = Object.entries(objs).flatMap(([pid,items])=>items.map(o=>({...o,phase:phaseNames[pid]})));
      const done    = allObjs.filter(o=>o.status==='complete');
      const active  = allObjs.filter(o=>o.status==='in_progress');
      const blocked = allObjs.filter(o=>o.status==='blocked');
      const dayNum  = (()=>{ if(!startDate) return null; const d=Math.floor((new Date()-new Date(startDate))/86400000)+1; return d<1?1:d>90?90:d; })();

      let hi = [];
      if(dayNum) hi.push('\u2022 Day ' + dayNum + ' of 90 \u2014 ' + done.length + '/' + allObjs.length + ' objectives complete across the 90-day plan.');
      done.forEach(o => hi.push('\u2022 Completed: ' + o.text + (o.notes ? ' \u2014 ' + o.notes : '')));
      intel.slice(0,3).forEach(i => hi.push('\u2022 ' + i.text));
      if(active.length>0) hi.push('\u2022 ' + active.length + ' objective' + (active.length>1?'s':'') + ' actively in progress: ' + active.map(o=>o.text.split('\u2014')[0].trim()).join('; ') + '.');
      if(hi.length===0) hi.push('\u2022 No significant updates this week.');

      let bl = [];
      blocked.forEach(o => bl.push('\u2022 ' + o.text + (o.notes ? ' \u2014 ' + o.notes : '')));
      if(bl.length===0) bl.push('No blockers this week.');

      let nw = [];
      active.forEach(o => nw.push('\u2022 Continue: ' + o.text.split('\u2014')[0].trim()));
      allObjs.filter(o=>o.status==='not_started').slice(0, Math.max(0,3-active.length)).forEach(o => nw.push('\u2022 Begin: ' + o.text.split('\u2014')[0].trim()));
      if(nw.length===0) nw.push('\u2022 Review overall plan progress and adjust priorities.');

      updateRpt('highlights', hi.join('\n'));
      updateRpt('blockers',   bl.join('\n'));
      updateRpt('nextWeek',   nw.join('\n'));
    } catch(e) {
      setAiError('Draft failed: ' + e.message);
    }
    setAiDrafting(false);
  };

  // sendWeeklyEmail moved to EmailPanel

      {/* Hidden print content */}
      <div ref={printContentRef} style={{display:"none"}}>
        <div style={{background:"#0d3a20",color:"white",padding:"18px 22px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"20px",borderRadius:"3px"}}>
          <div style={{display:"flex",alignItems:"center"}}>
            <span style={{background:"#3dbe7a",color:"#000",fontFamily:"monospace",fontWeight:"900",fontSize:"12px",padding:"5px 9px",borderRadius:"2px",marginRight:"12px"}}>CBRE</span>
            <div>
              <div style={{fontSize:"17px",color:"#d6ede0"}}>Weekly Progress Report</div>
              <div style={{fontSize:"10px",color:"#6b9e7e",fontFamily:"monospace",letterSpacing:"2px",marginTop:"2px"}}>GWS LOCAL · VICTORIA · BUSINESS UNIT DIRECTOR</div>
            </div>
          </div>
          <div style={{textAlign:"right",fontFamily:"monospace",fontSize:"11px",color:"#6b9e7e",lineHeight:"1.8"}}>
            <div>Week ending: <strong style={{color:"#3dbe7a"}}>{weLong}</strong></div>
            <div>Day: <strong style={{color:"#3dbe7a"}}>{day||"—"}</strong> of 90</div>
            <div>Generated: <strong style={{color:"#3dbe7a"}}>{today}</strong></div>
          </div>
        </div>
        <div style={{marginBottom:"20px"}}>
          <div style={{fontFamily:"monospace",fontSize:"10px",letterSpacing:"3px",textTransform:"uppercase",color:"#0d3a20",borderLeft:"4px solid #1a7a42",paddingLeft:"10px",marginBottom:"12px"}}>Plan Summary</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"10px"}}>
            {[{big:tot,label:"Total Objectives",sub:`${done} complete · ${act} active`,color:"#1a7a42"},{big:done,label:"Complete",sub:`${Math.round(done/tot*100)||0}% of plan`,color:"#1a7a42"},{big:blk>0?blk:act,label:blk>0?"Blocked":"In Progress",sub:blk>0?"Needs attention":"Actively working",color:blk>0?"#e07060":"#c8a94a"}].map((c,i)=>(
              <div key={i} style={{border:"1px solid #c8ddd0",borderTop:"3px solid #1a7a42",padding:"12px",borderRadius:"2px",textAlign:"center"}}>
                <div style={{fontSize:"28px",fontWeight:"700",color:c.color,fontFamily:"monospace",lineHeight:1}}>{c.big}</div>
                <div style={{fontSize:"9px",fontFamily:"monospace",letterSpacing:"2px",color:"#888",marginTop:"3px",textTransform:"uppercase"}}>{c.label}</div>
                <div style={{fontSize:"11px",color:"#555",marginTop:"4px"}}>{c.sub}</div>
              </div>
            ))}
          </div>
        </div>
        {PHASES.map(p=>{
          const o=objs[p.id],d=o.filter(x=>x.status==="complete").length,a=o.filter(x=>x.status==="in_progress").length,b=o.filter(x=>x.status==="blocked").length,pc=Math.round(d/o.length*100);
          return <div key={p.id} style={{marginBottom:"14px"}}>
            <div style={{background:"#0d3a20",color:"white",padding:"6px 12px",fontFamily:"monospace",fontSize:"10px",letterSpacing:"2px"}}>{p.fullLabel.toUpperCase()} — {p.theme.toUpperCase()}</div>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:"12px"}}>
              <thead><tr>
                <th style={{background:"#f4f8f5",color:"#0d3a20",fontFamily:"monospace",fontSize:"9px",padding:"7px 10px",border:"1px solid #c8ddd0",width:"28px"}}>#</th>
                <th style={{background:"#f4f8f5",color:"#0d3a20",fontFamily:"monospace",fontSize:"9px",padding:"7px 10px",border:"1px solid #c8ddd0",textAlign:"left"}}>Objective</th>
                <th style={{background:"#f4f8f5",color:"#0d3a20",fontFamily:"monospace",fontSize:"9px",padding:"7px 10px",border:"1px solid #c8ddd0",width:"100px",textAlign:"left"}}>Status</th>
              </tr></thead>
              <tbody>
                {o.map((obj,i)=>(
                  <tr key={obj.id} style={{background:i%2===0?"white":"#f9fcfa"}}>
                    <td style={{padding:"8px 10px",border:"1px solid #e8f0ec",textAlign:"center",color:"#888",fontFamily:"monospace",fontSize:"11px"}}>{i+1}</td>
                    <td style={{padding:"8px 10px",border:"1px solid #e8f0ec",lineHeight:"1.4"}}>{obj.text}{obj.notes&&<div style={{fontSize:"11px",color:"#666",fontStyle:"italic",marginTop:"3px",paddingLeft:"8px",borderLeft:"2px solid #c8ddd0"}}>{obj.notes}</div>}</td>
                    <td style={{padding:"8px 10px",border:"1px solid #e8f0ec"}}>
                      <span style={{display:"inline-block",width:"7px",height:"7px",borderRadius:"50%",background:sdColor[obj.status],marginRight:"4px"}}/>
                      <span style={{fontFamily:"monospace",fontSize:"10px",color:sdColor[obj.status]}}>{sdLabel[obj.status]}</span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div style={{display:"flex",alignItems:"center",gap:"10px",margin:"6px 0 0"}}>
              <div style={{flex:1,height:"4px",background:"#e8f0ec",borderRadius:"2px"}}><div style={{height:"100%",width:`${pc}%`,background:"#1a7a42",borderRadius:"2px"}}/></div>
              <span style={{fontFamily:"monospace",fontSize:"11px",color:"#1a7a42"}}>{pc}% · {d} done{a>0?` · ${a} active`:""}{b>0?` · ${b} blocked`:""}</span>
            </div>
          </div>;
        })}
        {intel.length>0&&<div style={{marginBottom:"20px"}}>
          <div style={{fontFamily:"monospace",fontSize:"10px",letterSpacing:"3px",textTransform:"uppercase",color:"#0d3a20",borderLeft:"4px solid #1a7a42",paddingLeft:"10px",marginBottom:"12px"}}>Intel & Observations</div>
          {intel.slice(0,8).map(item=>{
            const ip=PHASES.find(p=>p.id===item.phase);
            return <div key={item.id} style={{border:"1px solid #e8f0ec",borderLeft:"3px solid #1a7a42",padding:"9px 12px",marginBottom:"6px",background:"#f9fcfa"}}>
              <div style={{fontSize:"10px",fontFamily:"monospace",color:"#888",marginBottom:"3px"}}>{item.date} · {ip?.fullLabel}</div>
              <div style={{fontSize:"12px",color:"#222",lineHeight:"1.5"}}>{item.text}</div>
            </div>;
          })}
        </div>}
        {[{l:"Progress / Highlights",v:rpt.highlights},{l:"Blockers / Risks",v:rpt.blockers},{l:"Next Week Priorities",v:rpt.nextWeek}].map(n=>(
          <div key={n.l} style={{border:"1px solid #c8ddd0",borderRadius:"2px",overflow:"hidden",marginBottom:"8px"}}>
            <div style={{background:"#f4f8f5",padding:"7px 14px",fontFamily:"monospace",fontSize:"10px",color:"#0d3a20",letterSpacing:"1px",fontWeight:"600",textTransform:"uppercase"}}>{n.l}</div>
            <div style={{padding:"12px 14px",fontSize:"13px",color:"#222",lineHeight:"1.6",minHeight:"44px",whiteSpace:"pre-wrap"}}>{n.v||"—"}</div>
          </div>
        ))}
        <div style={{marginTop:"24px",paddingTop:"12px",borderTop:"2px solid #1a7a42",display:"flex",justifyContent:"space-between",fontFamily:"monospace",fontSize:"10px",color:"#888"}}>
          <div style={{fontStyle:"italic"}}>Protect the Base. Strengthen the Engine. Scale Profitably.</div>
          <div>CBRE GWS LOCAL · VICTORIA</div>
        </div>
      </div>
    </div>;
  };

  const TABS=[{id:"plan",l:"PLAN",I:IcoPlan},{id:"intel",l:"INTEL",I:IcoIntel},{id:"stats",l:"STATS",I:IcoStats},{id:"report",l:"REPORT",I:IcoReport}];

  return (
    <div style={{background:C.bg,fontFamily:"Georgia,serif",color:C.white,maxWidth:"480px",margin:"0 auto",minHeight:"100vh"}}>
      {/* TOP BAR */}
      <div style={{background:C.panel,borderBottom:`1px solid ${C.border}`,padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
          <div style={{background:C.green,color:"#000",fontFamily:"monospace",fontWeight:"900",fontSize:"11px",padding:"4px 8px",borderRadius:"2px"}}>CBRE</div>
          <div>
            <div style={{fontSize:"13px",lineHeight:1.2}}>90-Day Plan</div>
            <div style={{fontSize:"10px",color:C.muted,fontFamily:"monospace",letterSpacing:"1px"}}>GWS LOCAL · VIC</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
          {day>0&&<div style={{textAlign:"center",background:C.card,border:`1px solid ${C.greenDark}`,padding:"4px 10px",borderRadius:"3px"}}>
            <div style={{fontSize:"18px",color:C.green,fontFamily:"monospace",fontWeight:"700",lineHeight:1}}>{day}</div>
            <div style={{fontSize:"8px",color:C.muted,fontFamily:"monospace",letterSpacing:"1px"}}>/ 90</div>
          </div>}
          <div style={{fontSize:"10px",fontFamily:"monospace",color:saved?C.green:"transparent",transition:"color 0.3s"}}>✓ SAVED</div>
        </div>
      </div>
      {/* TABS */}
      <div style={{background:C.panel,borderBottom:`1px solid ${C.border}`,display:"flex"}}>
        {TABS.map(({id,l,I})=>(
          <button key={id} onClick={()=>setTab(id)} style={{flex:1,padding:"10px 4px 11px",background:"transparent",border:"none",borderBottom:`3px solid ${tab===id?C.green:"transparent"}`,color:tab===id?C.green:C.muted,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:"2px"}}>
            <I/><span style={{fontSize:"9px",fontFamily:"monospace",letterSpacing:"1px"}}>{l}</span>
          </button>
        ))}
      </div>
      {/* CONTENT */}
      <div style={{paddingBottom:"40px"}}>
        {tab==="plan"  &&<PlanTab/>}
        {tab==="intel" &&<IntelTab/>}
        {tab==="stats" &&<StatsTab/>}
        {tab==="report"&&<ReportTab/>}
      </div>
    </div>
  );
}


function Root() {
  const [authed, setAuthed] = useState(() => {
    try { return localStorage.getItem(AUTH_KEY) === PASS_HASH; } catch(e){ return false; }
  });
  if (!authed) return <LockScreen onUnlock={() => setAuthed(true)} />;
  return <App />;
}
ReactDOM.createRoot(document.getElementById("app")).render(<Root/>);

</script>
</body>
</html>
