async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}

function LockScreen({ onUnlock }) {
  const ref = useRef(null);
  const [err, setErr] = useState(false);
  const [checking, setChecking] = useState(false);

  const attempt = async () => {
    const val = ref.current?.value || "";
    if (!val.trim()) return;
    setChecking(true);
    const hash = await sha256(val.trim());
    if (hash === PASS_HASH) {
      localStorage.setItem(AUTH_KEY, hash);
      onUnlock();
    } else {
      setErr(true);
      setChecking(false);
      if (ref.current) ref.current.value = "";
      setTimeout(() => setErr(false), 2000);
    }
  };

  return (
    <div style={{minHeight:"100vh",background:"#0b1f14",display:"flex",alignItems:"center",justifyContent:"center",padding:"24px"}}>
      <div style={{width:"100%",maxWidth:"320px"}}>

          <input
            ref={ref}
            type="password"
            placeholder="Enter password"
            onKeyDown={e => e.key === "Enter" && attempt()}
            style={{width:"100%",background:"#152b1e",border:`1px solid ${err?"#e07060":"#1e3d2a"}`,color:"#f0f5f1",padding:"13px",fontFamily:"Georgia,serif",fontSize:"16px",borderRadius:"3px",outline:"none",boxSizing:"border-box",marginBottom:"10px",transition:"border-color 0.2s"}}

  );
}

const getNearestFriday = () => {
  const d = new Date();
  const day = d.getDay();
  const daysToFriday = day === 0 ? 5 : day === 6 ? 6 : (5 - day);
  d.setDate(d.getDate() + daysToFriday);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return yyyy + '-' + mm + '-' + dd;
};
const fmtDate = (iso) => {
  if (!iso) return '';
  const p = iso.split('-');
  return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
};

      <div style={{display:"flex",gap:"6px",marginBottom:"10px"}}>
        {PHASES.map(p=>(
          <button key={p.id} onClick={()=>setPhase(p.id)} style={{flex:1,padding:"8px 4px",background:phase===p.id?C.greenDark:"transparent",border:`1px solid ${phase===p.id?C.green:C.border}`,color:phase===p.id?C.green:C.muted,fontFamily:"monospace",fontSize:"10px",borderRadius:"3px",cursor:"pointer"}}>Days {p.label}</button>
        ))}
      </div>
      <textarea ref={ref} placeholder="Paste or type observations, meeting notes, stakeholder intel..." rows={4} style={{...inp,resize:"none",marginBottom:"8px"}}/>
      <button onClick={()=>{logIntel(ref.current?.value||"",phase);if(ref.current)ref.current.value="";}} style={{...btnG,marginBottom:"20px"}}>LOG INTEL</button>
      <div style={lbl}>Previous Entries ({intel.length})</div>
      {intel.length===0
        ?<div style={{color:C.faint,fontSize:"13px",textAlign:"center",padding:"24px 0",fontStyle:"italic"}}>No intel logged yet</div>
        :intel.map(item=>{
          const ip=PHASES.find(p=>p.id===item.phase);
          return <div key={item.id} style={{background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${C.greenDark}`,borderRadius:"3px",padding:"12px 14px",marginBottom:"8px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:"5px"}}>
              <span style={{fontSize:"10px",fontFamily:"monospace",color:C.muted}}>{item.date} · {ip?.fullLabel}</span>
              <button onClick={()=>delIntel(item.id)} style={{background:"transparent",border:"none",color:C.faint,cursor:"pointer",fontSize:"22px",lineHeight:1,padding:"0 0 0 12px"}}>×</button>
            </div>
            <div style={{fontSize:"14px",color:"#b0d0b8",lineHeight:"1.55"}}>{item.text}</div>
          </div>;
        })
      }
    </div>;
  };

  // ── STATS ──
  _StatsTab = ()=>{
    const c={complete:0,in_progress:0,blocked:0,not_started:0};
    allO.forEach(o=>c[o.status]++);
    return <div style={{padding:"16px"}}>
      {day>0&&<div style={{background:C.card,border:`1px solid ${C.greenDark}`,borderRadius:"4px",padding:"20px",textAlign:"center",marginBottom:"16px"}}>
        <div style={{fontSize:"56px",fontFamily:"monospace",fontWeight:"700",color:C.green,lineHeight:1}}>{day}</div>
        <div style={{fontSize:"12px",fontFamily:"monospace",color:C.muted,letterSpacing:"3px",marginTop:"4px"}}>DAY{day!==1?"S":""} INTO 90</div>
        <div style={{marginTop:"14px",height:"6px",background:C.faint,borderRadius:"3px"}}>
          <div style={{height:"100%",width:`${Math.min(day/90*100,100)}%`,background:C.green,borderRadius:"3px"}}/>
        </div>
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"16px"}}>
        {[{l:"Complete",v:c.complete,col:C.green},{l:"Active",v:c.in_progress,col:C.gold},{l:"Blocked",v:c.blocked,col:C.risk},{l:"Not Started",v:c.not_started,col:C.muted}].map(x=>(
          <div key={x.l} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"3px",padding:"14px",textAlign:"center"}}>
            <div style={{fontSize:"32px",fontFamily:"monospace",fontWeight:"700",color:x.col,lineHeight:1}}>{x.v}</div>
            <div style={{fontSize:"10px",fontFamily:"monospace",color:C.muted,letterSpacing:"2px",marginTop:"4px"}}>{x.l.toUpperCase()}</div>
          </div>
        ))}
      </div>
      <div style={lbl}>Phase Progress</div>
      {PHASES.map(p=>{
        const o=objs[p.id],d=o.filter(x=>x.status==="complete").length,a=o.filter(x=>x.status==="in_progress").length,b=o.filter(x=>x.status==="blocked").length,pc=Math.round(d/o.length*100);
        return <div key={p.id} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"3px",padding:"14px",marginBottom:"8px"}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:"6px"}}>
            <div>
              <div style={{fontSize:"11px",fontFamily:"monospace",color:C.muted}}>{p.fullLabel}</div>
              <div style={{fontSize:"14px",color:C.green}}>{p.theme}</div>
            </div>
            <div style={{fontFamily:"monospace",fontSize:"22px",fontWeight:"700",color:pc===100?C.green:C.white}}>{pc}%</div>
          </div>
          <div style={{height:"4px",background:C.faint,borderRadius:"2px",marginBottom:"8px",position:"relative"}}>
            <div style={{position:"absolute",height:"100%",width:`${Math.min((d+a)/o.length*100,100)}%`,background:C.gold,borderRadius:"2px",left:0}}/>
            <div style={{position:"absolute",height:"100%",width:`${pc}%`,background:C.green,borderRadius:"2px",left:0}}/>
          </div>
          <div style={{display:"flex",gap:"12px"}}>
            <span style={{fontSize:"11px",fontFamily:"monospace",color:C.green}}>{d} done</span>
            {a>0&&<span style={{fontSize:"11px",fontFamily:"monospace",color:C.gold}}>{a} active</span>}
            {b>0&&<span style={{fontSize:"11px",fontFamily:"monospace",color:C.risk}}>{b} blocked</span>}
          </div>
        </div>;
      })}
      <div style={{marginTop:"16px"}}>
        <div style={lbl}>Start Date</div>
        <input type="date" defaultValue={startDate} onBlur={e=>{setStartDate(e.target.value);persist(objs,intel,e.target.value);}} style={{...inp}}/>
      </div>
      <div style={{marginTop:"20px",paddingTop:"16px",borderTop:`1px solid ${C.border}`}}>
        <div style={lbl}>Sync Between Devices</div>
        <div style={{fontSize:"12px",color:C.muted,marginBottom:"12px",lineHeight:"1.6"}}>Export copies your data to clipboard. On your other device, tap Import and paste it in.</div>
        <div style={{display:"flex",gap:"8px"}}>
          <button onClick={exportData} style={{flex:1,background:C.green,color:"#000",border:"none",padding:"13px",fontFamily:"monospace",fontSize:"12px",fontWeight:"700",letterSpacing:"1px",borderRadius:"3px",cursor:"pointer"}}>📤 EXPORT</button>
          <button onClick={importData} style={{flex:1,background:"transparent",color:C.green,border:`1px solid ${C.green}`,padding:"13px",fontFamily:"monospace",fontSize:"12px",fontWeight:"700",letterSpacing:"1px",borderRadius:"3px",cursor:"pointer"}}>📥 IMPORT</button>
        </div>
      </div>
      <div style={{marginTop:"16px",paddingTop:"16px",borderTop:`1px solid ${C.border}`}}>
        <div style={lbl}>Smart Sync API Key</div>
        <button onClick={()=>{
          const k = window.prompt('Paste your Anthropic API key (sk-ant-...):');
          if(k&&k.trim().startsWith('sk-ant-')){localStorage.setItem(API_KEY_STORAGE,k.trim());alert('✅ API key saved.');}
          else if(k){alert('Invalid key - should start with sk-ant-');}
        }} style={{...btnO,width:"100%",textAlign:"center"}}>🔑 UPDATE API KEY</button>
      </div>
    </div>;
  };

  // ── REPORT ──
  _ReportTab = ()=>{
    const sdColor={complete:"#1a7a42",in_progress:"#c8a94a",blocked:"#e07060",not_started:"#ccc"};
    const sdLabel={complete:"Complete",in_progress:"In Progress",blocked:"Blocked",not_started:"Not Started"};
    const today=new Date().toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"});
    const weLong=rpt.weekEnding?new Date(rpt.weekEnding+"T00:00:00").toLocaleDateString("en-AU",{day:"numeric",month:"long",year:"numeric"}):"—";

    return <div style={{padding:"16px"}}>
      <div style={lbl}>Weekly Report</div>

      {/* SMART SYNC BUTTON */}
      <button
        onClick={smartSync}
        disabled={syncing}
        style={{
          ...btnG,
          marginBottom:"6px",
          background: syncing ? C.greenDark : "#1a3a4a",
          border: `2px solid ${C.green}`,
          opacity: syncing ? 0.8 : 1,
          position:"relative"
        }}
      >
        {syncing ? `⏳ ${syncStatus||'SYNCING...'}` : '🔄 SMART SYNC — UPDATE PLAN, STATS & REPORT'}
      </button>
      {syncStatus==='done' && <div style={{color:C.green,fontSize:"12px",fontFamily:"monospace",textAlign:"center",marginBottom:"8px",fontWeight:700}}>✅ Plan, stats and report updated from your intel</div>}
      {syncStatus==='error' && <div style={{color:C.risk,fontSize:"12px",fontFamily:"monospace",textAlign:"center",marginBottom:"8px"}}>⚠️ Sync failed — check connection and try again</div>}
      <div style={{fontSize:"11px",color:C.muted,textAlign:"center",marginBottom:"16px",fontStyle:"italic"}}>Reads all intel → updates objective statuses, notes, stats and drafts your report in one go</div>

      <div style={{marginBottom:"10px"}}>
        <div style={{fontSize:"10px",fontFamily:"monospace",color:C.muted,letterSpacing:"2px",marginBottom:"5px",textTransform:"uppercase"}}>Week Ending</div>
        <input type="date" value={rpt.weekEnding||""} onChange={e=>updateRpt("weekEnding",e.target.value)} style={{...inp}}/>
      </div>
      {[{k:"highlights",l:"Progress / Highlights",ph:"Key things achieved this week..."},{k:"blockers",l:"Blockers / Risks",ph:"Issues, risks, things needing support..."},{k:"nextWeek",l:"Next Week Priorities",ph:"Top priorities for next week..."}].map(f=>(
        <div key={f.k} style={{marginBottom:"10px"}}>
          <div style={{fontSize:"10px",fontFamily:"monospace",color:C.muted,letterSpacing:"2px",marginBottom:"5px",textTransform:"uppercase"}}>{f.l}</div>
          <textarea value={rpt[f.k]||""} onChange={e=>updateRpt(f.k,e.target.value)} placeholder={f.ph} rows={3} style={{...inp,resize:"none"}}/>
        </div>
      ))}
      <button onClick={cleanUpNotes} style={{...btnG,marginBottom:"8px",background:C.greenDark,border:'1px solid '+C.green}}>
        🧹 CLEAN UP MY NOTES
      </button>
      <div style={{fontSize:"11px",color:C.muted,textAlign:"center",marginBottom:"8px",fontStyle:"italic"}}>Opens Claude - paste your raw dictated notes to get clean professional copy back</div>
      <button onClick={printReport} style={{...btnG,marginTop:"4px",marginBottom:"6px"}}>🖨 PRINT / EXPORT PDF</button>
      <EmailPanel C={C} btnG={btnG} objs={objs} rpt={rpt} startDate={startDate} fmtDate={fmtDate} getNearestFriday={getNearestFriday}/>
      <div style={{fontSize:"11px",color:C.muted,textAlign:"center",marginBottom:"20px",fontStyle:"italic"}}>Opens print dialog - save as PDF to share</div>
      <div style={lbl}>Preview</div>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:"3px",padding:"14px",fontSize:"13px",color:C.muted,lineHeight:"1.9"}}>
        <div>📅 Week ending: <span style={{color:C.white}}>{weLong}</span></div>
        <div>📊 Overall: <span style={{color:C.green}}>{done}/{tot} complete</span>{blk>0&&<span style={{color:C.risk}}> · {blk} blocked</span>}</div>
        {PHASES.map(p=><div key={p.id}>✦ {p.fullLabel}: <span style={{color:C.green}}>{pct(p.id)}%</span></div>)}
        <div>📝 Intel entries: <span style={{color:C.white}}>{intel.length}</span></div>
      </div>
      <div ref={printContentRef} style={{display:"none"}}>
        <div style={{background:"#0d3a20",color:"white",padding:"18px 22px",display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:"20px",borderRadius:"3px"}}>
          <div style={{display:"flex",alignItems:"center"}}>
            <span style={{background:"#3dbe7a",color:"#000",fontFamily:"monospace",fontWeight:"900",fontSize:"12px",padding:"5px 9px",borderRadius:"2px",marginRight:"12px"}}>CBRE</span>
            <div>
              <div style={{fontSize:"17px",color:"#d6ede0"}}>Weekly Progress Report</div>
              <div style={{fontSize:"10px",color:"#6b9e7e",fontFamily:"monospace",letterSpacing:"2px",marginTop:"2px"}}>GWS LOCAL · VICTORIA · BUSINESS UNIT DIRECTOR</div>
            </div>
          </div>
          <div style={{textAlign:"right",fontFamily:"monospace",fontSize:"11px",color:"#6b9e7e",lineHeight:"1.8"}}>
            <div>Week ending: <strong style={{color:"#3dbe7a"}}>{weLong}</strong></div>
            <div>Day: <strong style={{color:"#3dbe7a"}}>{day||"-"}</strong> of 90</div>
            <div>Generated: <strong style={{color:"#3dbe7a"}}>{today}</strong></div>
          </div>
        </div>
        <div style={{marginBottom:"20px"}}>
          <div style={{fontFamily:"monospace",fontSize:"10px",letterSpacing:"3px",textTransform:"uppercase",color:"#0d3a20",borderLeft:"4px solid #1a7a42",paddingLeft:"10px",marginBottom:"12px"}}>Plan Summary</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"10px"}}>
            {[{big:tot,label:"Total Objectives",sub:`${done} complete · ${act} active`,color:"#1a7a42"},{big:done,label:"Complete",sub:`${Math.round(done/tot*100)||0}% of plan`,color:"#1a7a42"},{big:blk>0?blk:act,label:blk>0?"Blocked":"In Progress",sub:blk>0?"Needs attention":"Actively working",color:blk>0?"#e07060":"#c8a94a"}].map((c,i)=>(
              <div key={i} style={{border:"1px solid #c8ddd0",borderTop:"3px solid #1a7a42",padding:"12px",borderRadius:"2px",textAlign:"center"}}>
                <div style={{fontSize:"28px",fontWeight:"700",color:c.color,fontFamily:"monospace",lineHeight:1}}>{c.big}</div>
                <div style={{fontSize:"9px",fontFamily:"monospace",letterSpacing:"2px",color:"#888",marginTop:"3px",textTransform:"uppercase"}}>{c.label}</div>
                <div style={{fontSize:"11px",color:"#555",marginTop:"4px"}}>{c.sub}</div>
              </div>
            ))}
          </div>
        </div>
        {PHASES.map(p=>{
          const o=objs[p.id],d=o.filter(x=>x.status==="complete").length,a=o.filter(x=>x.status==="in_progress").length,b=o.filter(x=>x.status==="blocked").length,pc=Math.round(d/o.length*100);
          return <div key={p.id} style={{marginBottom:"14px"}}>
            <div style={{background:"#0d3a20",color:"white",padding:"6px 12px",fontFamily:"monospace",fontSize:"10px",letterSpacing:"2px"}}>{p.fullLabel.toUpperCase()} - {p.theme.toUpperCase()}</div>
            <table style={{width:"100%",borderCollapse:"collapse",fontSize:"12px"}}>
              <thead><tr>
                <th style={{background:"#f4f8f5",color:"#0d3a20",fontFamily:"monospace",fontSize:"9px",padding:"7px 10px",border:"1px solid #c8ddd0",width:"28px"}}>#</th>
                <th style={{background:"#f4f8f5",color:"#0d3a20",fontFamily:"monospace",fontSize:"9px",padding:"7px 10px",border:"1px solid #c8ddd0",textAlign:"left"}}>Objective</th>
                <th style={{background:"#f4f8f5",color:"#0d3a20",fontFamily:"monospace",fontSize:"9px",padding:"7px 10px",border:"1px solid #c8ddd0",width:"100px",textAlign:"left"}}>Status</th>
              </tr></thead>
              <tbody>
                {o.map((obj,i)=>(
                  <tr key={obj.id} style={{background:i%2===0?"white":"#f9fcfa"}}>
                    <td style={{padding:"8px 10px",border:"1px solid #e8f0ec",textAlign:"center",color:"#888",fontFamily:"monospace",fontSize:"11px"}}>{i+1}</td>
                    <td style={{padding:"8px 10px",border:"1px solid #e8f0ec",lineHeight:"1.4"}}>{obj.text}{obj.notes&&<div style={{fontSize:"11px",color:"#666",fontStyle:"italic",marginTop:"3px",paddingLeft:"8px",borderLeft:"2px solid #c8ddd0"}}>{obj.notes}</div>}</td>
                    <td style={{padding:"8px 10px",border:"1px solid #e8f0ec"}}>
                      <span style={{display:"inline-block",width:"7px",height:"7px",borderRadius:"50%",background:sdColor[obj.status],marginRight:"4px"}}/>
                      <span style={{fontFamily:"monospace",fontSize:"10px",color:sdColor[obj.status]}}>{sdLabel[obj.status]}</span>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div style={{display:"flex",alignItems:"center",gap:"10px",margin:"6px 0 0"}}>
              <div style={{flex:1,height:"4px",background:"#e8f0ec",borderRadius:"2px"}}><div style={{height:"100%",width:`${pc}%`,background:"#1a7a42",borderRadius:"2px"}}/></div>
              <span style={{fontFamily:"monospace",fontSize:"11px",color:"#1a7a42"}}>{pc}% · {d} done{a>0?` · ${a} active`:""}{b>0?` · ${b} blocked`:""}</span>
            </div>
          </div>;
        })}
        {intel.length>0&&<div style={{marginBottom:"20px"}}>
          <div style={{fontFamily:"monospace",fontSize:"10px",letterSpacing:"3px",textTransform:"uppercase",color:"#0d3a20",borderLeft:"4px solid #1a7a42",paddingLeft:"10px",marginBottom:"12px"}}>Intel & Observations</div>
          {intel.slice(0,8).map(item=>{
            const ip=PHASES.find(p=>p.id===item.phase);
            return <div key={item.id} style={{border:"1px solid #e8f0ec",borderLeft:"3px solid #1a7a42",padding:"9px 12px",marginBottom:"6px",background:"#f9fcfa"}}>
              <div style={{fontSize:"10px",fontFamily:"monospace",color:"#888",marginBottom:"3px"}}>{item.date} · {ip?.fullLabel}</div>
              <div style={{fontSize:"12px",color:"#222",lineHeight:"1.5"}}>{item.text}</div>
            </div>;
          })}
        </div>}
        {[{l:"Progress / Highlights",v:rpt.highlights},{l:"Blockers / Risks",v:rpt.blockers},{l:"Next Week Priorities",v:rpt.nextWeek}].map(n=>(
          <div key={n.l} style={{border:"1px solid #c8ddd0",borderRadius:"2px",overflow:"hidden",marginBottom:"8px"}}>
            <div style={{background:"#f4f8f5",padding:"7px 14px",fontFamily:"monospace",fontSize:"10px",color:"#0d3a20",letterSpacing:"1px",fontWeight:"600",textTransform:"uppercase"}}>{n.l}</div>
            <div style={{padding:"12px 14px",fontSize:"13px",color:"#222",lineHeight:"1.6",minHeight:"44px",whiteSpace:"pre-wrap"}}>{n.v||"-"}</div>
          </div>
        ))}
        <div style={{marginTop:"24px",paddingTop:"12px",borderTop:"2px solid #1a7a42",display:"flex",justifyContent:"space-between",fontFamily:"monospace",fontSize:"10px",color:"#888"}}>
          <div style={{fontStyle:"italic"}}>Protect the Base. Strengthen the Engine. Scale Profitably.</div>
          <div>CBRE GWS LOCAL · VICTORIA</div>
        </div>
      </div>
    </div>;
  };

  const TABS=[{id:"plan",l:"PLAN",I:IcoPlan},{id:"intel",l:"INTEL",I:IcoIntel},{id:"stats",l:"STATS",I:IcoStats},{id:"report",l:"REPORT",I:IcoReport}];

  return (
    <div style={{background:C.bg,fontFamily:"Georgia,serif",color:C.white,maxWidth:"480px",margin:"0 auto",minHeight:"100vh"}}>
      <div style={{background:C.panel,borderBottom:`1px solid ${C.border}`,padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
        <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
          <div style={{background:C.green,color:"#000",fontFamily:"monospace",fontWeight:"900",fontSize:"11px",padding:"4px 8px",borderRadius:"2px"}}>CBRE</div>
          <div>
            <div style={{fontSize:"13px",lineHeight:1.2}}>90-Day Plan</div>
            <div style={{fontSize:"10px",color:C.muted,fontFamily:"monospace",letterSpacing:"1px"}}>GWS LOCAL · VIC</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
          {day>0&&<div style={{textAlign:"center",background:C.card,border:`1px solid ${C.greenDark}`,padding:"4px 10px",borderRadius:"3px"}}>
            <div style={{fontSize:"18px",color:C.green,fontFamily:"monospace",fontWeight:"700",lineHeight:1}}>{day}</div>
            <div style={{fontSize:"8px",color:C.muted,fontFamily:"monospace",letterSpacing:"1px"}}>/ 90</div>
          </div>}
          <div style={{fontSize:"10px",fontFamily:"monospace",color:saved?C.green:"transparent",transition:"color 0.3s"}}>✓ SAVED</div>
        </div>
      </div>
      <div style={{background:C.panel,borderBottom:`1px solid ${C.border}`,display:"flex"}}>
        {TABS.map(({id,l,I})=>(
          <button key={id} onClick={()=>setTab(id)} style={{flex:1,padding:"10px 4px 11px",background:"transparent",border:"none",borderBottom:`3px solid ${tab===id?C.green:"transparent"}`,color:tab===id?C.green:C.muted,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:"2px"}}>
            <I/><span style={{fontSize:"9px",fontFamily:"monospace",letterSpacing:"1px"}}>{l}</span>
          </button>
        ))}
      </div>
      <div style={{paddingBottom:"40px"}}>
        {tab==="plan"  &&<PlanTab/>}
        {tab==="intel" &&<IntelTab/>}
        {tab==="stats" &&<StatsTab/>}
        {tab==="report"&&<ReportTab/>}
      </div>
    </div>
  );
}

function Root() {
  const [authed, setAuthed] = useState(() => {
    try { return localStorage.getItem(AUTH_KEY) === PASS_HASH; } catch(e){ return false; }
  });
  const [apiKey, setApiKey] = useState(() => {
    try { return localStorage.getItem(API_KEY_STORAGE) || ''; } catch(e){ return ''; }
  });

  if (!authed) return <LockScreen onUnlock={() => setAuthed(true)} />;
  if (!apiKey) return <ApiKeyScreen onSave={(k) => setApiKey(k)} />;
  return <App />;
}
ReactDOM.createRoot(document.getElementById("app")).render(<Root/>);
</script>
</body>
</html>
